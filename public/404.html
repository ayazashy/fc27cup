<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>كأس السكن: FC27 | تحويل المسار</title>
    <script>
      // SPA Router redirect for GitHub Pages
      (function() {
        var l = window.location;
        var pathname = l.pathname;
        var search = l.search;
        var hash = l.hash;

        var isKsuStaff = pathname.toUpperCase().indexOf('KSUHTSTAFF') !== -1 || search.toUpperCase().indexOf('KSUHTSTAFF') !== -1 || hash.toUpperCase().indexOf('KSUHTSTAFF') !== -1;
        var redirectQuery = isKsuStaff ? '?KSUHTSTAFF' : search;

        // Ensure GitHub Pages ALWAYS preserves /fc27cup/ and never strips it
        var isGitHubPages = l.hostname.indexOf('github.io') !== -1;
        var repoPrefix = isGitHubPages ? '/fc27cup/' : '/';

        l.replace(repoPrefix + redirectQuery + hash);
      })();
    </script>
  </head>
  <body style="font-family: sans-serif; text-align: center; padding: 40px; background: #0F172A; color: #FFF;">
    <p>جاري تحويلك إلى نظام بطولة كأس السكن FC27...</p>
  </body>
</html>
